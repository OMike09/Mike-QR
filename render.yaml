# Déploiement Render — un clic après avoir poussé ce dossier sur GitHub.
# Render crée la base PostgreSQL et relie DATABASE_URL automatiquement.
services:
  - type: web
    name: oymike-tech
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: oymike-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false          # à saisir dans le tableau de bord Render (jamais dans le dépôt)
      - key: PUBLIC_BASE_URL
        sync: false          # ex. https://oymike-tech.onrender.com

databases:
  - name: oymike-db
    plan: basic-256mb
