<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-label="Salle de restaurant avec tables numérotées">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef6f1"/>
      <stop offset="1" stop-color="#dcebe2"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe2d6"/>
      <stop offset="1" stop-color="#b9d3c4"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c98d5a"/>
      <stop offset="1" stop-color="#a86f42"/>
    </linearGradient>
  </defs>
  <rect width="640" height="280" fill="url(#wall)"/>
  <rect y="150" width="640" height="130" fill="url(#floor)"/>
  <!-- fenêtres -->
  <g opacity=".85">
    <rect x="48" y="34" width="96" height="86" rx="6" fill="#ffffff" stroke="#9fc4ae" stroke-width="3"/>
    <path d="M96 34v86M48 77h96" stroke="#9fc4ae" stroke-width="2"/>
    <rect x="168" y="34" width="96" height="86" rx="6" fill="#ffffff" stroke="#9fc4ae" stroke-width="3"/>
    <path d="M216 34v86M168 77h96" stroke="#9fc4ae" stroke-width="2"/>
  </g>
  <!-- plantes -->
  <g fill="#3f8f62">
    <path d="M556 150c0-26 12-44 22-52 4 18 2 38-6 52z"/>
    <path d="M578 150c-2-22 6-40 20-48 2 18-6 36-20 48z"/>
    <path d="M534 150c-4-18 2-34 14-42 4 16-2 32-14 42z"/>
  </g>
  <path d="M528 150h76l-8 34h-60z" fill="#b5763f"/>
  <!-- table centrale -->
  <ellipse cx="330" cy="212" rx="104" ry="22" fill="#9db9a8" opacity=".55"/>
  <rect x="240" y="168" width="180" height="16" rx="8" fill="url(#wood)"/>
  <rect x="252" y="184" width="12" height="46" rx="5" fill="#8d5a33"/>
  <rect x="396" y="184" width="12" height="46" rx="5" fill="#8d5a33"/>
  <!-- chaises -->
  <g fill="#87a696">
    <rect x="196" y="160" width="26" height="54" rx="10"/>
    <rect x="438" y="160" width="26" height="54" rx="10"/>
  </g>
  <!-- couverts -->
  <g fill="#ffffff" stroke="#c8d8ce" stroke-width="1.5">
    <circle cx="288" cy="176" r="11"/>
    <circle cx="372" cy="176" r="11"/>
  </g>
  <!-- numéros de table -->
  <g font-family="Inter, Arial, sans-serif" font-weight="800" font-size="16" text-anchor="middle">
    <rect x="306" y="120" width="48" height="30" rx="8" fill="#0d725c"/>
    <text x="330" y="141" fill="#ffffff">N° 1</text>
  </g>
</svg>
